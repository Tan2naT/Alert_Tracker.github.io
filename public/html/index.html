<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking System Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="dashboard">
    <header class="header">
      <div class="logo-area">
        <img src="../img/Panic%20Tracker.png" alt="Panic Tracker logo">
      </div>

      <div class="header-text">
        <h1>Tracking System Dashboard</h1>
        <p>View saved coordinates and their exact location on Google Maps.</p>
      </div>
    </header>

    <section class="card">
      <div class="card-header">
        <h2>Coordinate Records</h2>
        <span class="selected-location" id="latestLocation">Device location loading...</span>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>No.</th>
              <th>Device</th>
              <th>Coordinates</th>
              <th>Time Added</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="coordinateTable"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Google Map Location</h2>
        <span class="selected-location" id="selectedCoordinates"></span>
      </div>

      <div class="map-container">
        <iframe
          id="mapFrame"
          title="Google Map Location"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </section>
  </main>

  <script src="../js/app.js?v=20260520-device-origin"></script>
</body>
</html>
